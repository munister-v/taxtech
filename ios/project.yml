name: Kopiyka
options:
  bundleIdPrefix: com.eprisjournal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: uk

packages:
  EdgeRouter:
    path: ../EdgeRouter

settings:
  base:
    DEVELOPMENT_TEAM: 63PXV4HLQZ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Kopiyka:
    type: application
    platform: iOS
    sources:
      - path: Kopiyka
    dependencies:
      - package: EdgeRouter
        product: EdgeRouter
      - package: EdgeRouter
        product: FraudLite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eprisjournal.kopiyka
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TaxTech
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Щоб сфотографувати чек. Фото розпізнається на телефоні й нікуди не надсилається.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Щоб підключитися до навчального сервера в локальній мережі.
    info:
      path: Kopiyka/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

schemes:
  Kopiyka:
    build:
      targets:
        Kopiyka: all
    run:
      config: Debug
